<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MyVirtualTAs - Session History</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:      #1A3480;
            --navy-2:    #142970;
            --navy-dark: #0A1535;
            --navy-3:    #0F1F55;
            --orange:    #E8622A;
            --orange-2:  #F07842;
            --teal:      #2BA8BF;
            --teal-2:    #3DBDD6;
            --white:     #FFFFFF;
            --off:       #F5F7FC;
            --border:    #DDE4F5;
            --text:      #0A1535;
            --muted:     #5B6E96;
            --light:     #8A9BBE;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; }

        /* ══ TOP NAV ══ */
        .topnav {
            background: var(--navy-dark);
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 24px rgba(10,21,53,.5);
        }
        .nav-logo { display: flex; align-items: center; gap: 13px; text-decoration: none; }
        .logo-svg-wrap {
            width: 46px;
            height: 46px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,.2);
        }
        .logo-text-block { line-height: 1.1; }
        .logo-my {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--white);
        }
        .logo-virtual {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--orange);
        }
        .logo-tas {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--teal);
        }.logo-powered { font-size: .58rem; color: rgba(255,255,255,.35); font-weight: 600; letter-spacing: .06em; margin-top: 1px; }
        .logo-powered span { color: rgba(255,255,255,.6); }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            text-decoration: none;
            color: rgba(255,255,255,.7);
            font-size: .78rem; font-weight: 700;
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.06);
            transition: all .15s;
        }
        .nav-btn:hover { background: rgba(255,255,255,.12); color: white; }
        .nav-btn-primary {
            background: var(--orange);
            border-color: var(--orange);
            color: white;
        }
        .nav-btn-primary:hover { background: var(--orange-2); }

        /* ══ PAGE BODY ══ */
        .body-wrap { max-width: 1100px; margin: 36px auto; padding: 0 20px 60px; }

        /* ══ PAGE HEADER ══ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .page-title-block {}
        .page-eyebrow {
            font-size: .72rem;
            font-weight: 800;
            color: var(--teal);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .page-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--navy-dark);
        }
        .btn-back {
            background: var(--navy);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: .82rem;
            transition: all .15s;
        }
        .btn-back:hover { background: var(--navy-2); transform: translateY(-1px); }

        /* ══ HISTORY LIST ══ */
        .history-list { display: flex; flex-direction: column; gap: 16px; }

        /* ══ NOTE CARD ══ */
        .note-card {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(26,52,128,.05);
            transition: box-shadow .2s;
        }
        .note-card:hover { box-shadow: 0 6px 24px rgba(26,52,128,.1); }

        /* ══ CARD HEADER — METADATA GRID ══ */
        .card-header {
            background: var(--navy-3);
            padding: 14px 20px;
            display: grid;
            /*grid-template-columns: 140px 180px 1fr 90px 56px;*/
            grid-template-columns: 140px 180px 1fr 90px 120px;
            align-items: center;
            gap: 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .meta-cell {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 16px;
            border-right: 1px solid rgba(255,255,255,.07);
        }
        .meta-cell:last-child { border-right: none; padding-right: 0; }
        .meta-cell:not(:first-child) { padding-left: 16px; }

        .meta-label {
            font-size: .58rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255,255,255,.3);
        }
        .meta-value {
            font-size: .82rem;
            font-weight: 700;
            color: rgba(255,255,255,.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Type badges */
        .type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: .65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
            width: fit-content;
        }
        .badge-group  { background: var(--orange);  color: var(--white); }
        .badge-single { background: var(--teal);    color: var(--white); }

        /* State pill */
        .state-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 800;
            width: fit-content;
        }
        .state-florida { background: rgba(43,168,191,.2); color: var(--teal-2); border: 1px solid rgba(43,168,191,.3); }
        .state-maryland { background: rgba(26,52,128,.4); color: #7EB3FF; border: 1px solid rgba(126,179,255,.3); }
        .state-common { background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.1); }

        /* Grade circle */
        .grade-circle {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            border: 1.5px solid rgba(255,255,255,.15);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: .85rem;
            color: var(--teal-2);
            margin: auto;
            /* ✅ ADD THESE */
            overflow: hidden;
            flex-shrink: 0;
            white-space: nowrap;

        }

        /* ══ CARD BODY ══ */
        .card-body { padding: 18px 20px; }

        .standard-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #F0F4FF;
            border-radius: 8px;
            border-left: 3px solid var(--navy);
        }
        .standard-icon { font-size: .8rem; margin-top: 1px; flex-shrink: 0; }
        .standard-text {
            font-size: .73rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.4;
        }

        .note-label {
            font-size: .68rem;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 8px;
        }
        .note-text {
            font-size: .88rem;
            line-height: 1.65;
            color: #1E293B;
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            padding: 14px 16px;
            border-radius: 10px;
            font-style: italic;
        }

        /* ══ EMPTY STATE ══ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
        .empty-title { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--navy); }
        .empty-sub { font-size: .83rem; }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 768px) {
            .card-header {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
                gap: 12px;
            }
            .meta-cell { border-right: none; padding: 0; }
            .topnav { padding: 0 16px; }
            .body-wrap { padding: 0 12px 40px; }
        }
    </style>
</head>
<body>

<!-- ══ TOP NAV ══ -->
<nav class="topnav">
    <a th:href="@{/dashboard}" class="nav-logo" style="text-decoration:none;">
        <div class="logo-svg-wrap">
            <img src="/logo.png" alt="MyVirtualTAs Logo" style="width:66px;height:58px;object-fit:contain;">
        </div>
        <div class="logo-text-block">
            <div class="logo-text-block">
                <div><span class="logo-my">Triv</span><span class="logo-virtual">ekii</span><span class="logo-tas"></span></div>
                <!--                <div class="logo-powered">powered by <span>eurekii</span></div>-->
            </div>
        </div>
    </a>
    <div class="nav-right">
        <a href="/dashboard" class="nav-btn">Dashboard</a>
        <a href="/notes"     class="nav-btn nav-btn-primary">+ New Note</a>
    </div>
</nav>

<!-- ══ BODY ══ -->
<div class="body-wrap">

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-title-block">
            <div class="page-eyebrow">Session Archive</div>
            <h1 class="page-title">Saved Session History</h1>
        </div>
        <a href="/notes" class="btn-back">Back to Generator</a>
    </div>

    <!-- History List -->
    <div class="history-list">

        <div th:each="n : ${savedNotes}" class="note-card">

            <!-- ══ METADATA GRID HEADER ══ -->
            <div class="card-header">

                <!-- Date -->
                <div class="meta-cell">
                    <span class="meta-label">📅 Session Date</span>
                    <span class="meta-value" th:text="${n.sessionDate != null ? n.sessionDate : '—'}"></span>
                </div>

                <!-- Student Names -->
                <div class="meta-cell">
                    <span class="meta-label">👩‍🎓 Student(s)</span>
                    <span class="meta-value" th:text="${n.studentName != null ? n.studentName : '—'}"></span>
                </div>

                <!-- Note Type -->
                <div class="meta-cell">
                    <span class="meta-label">📋 Type</span>
                    <span th:if="${n.subject == 'Overall' or n.subject == 'Group' or n.subject == 'Group Class Note'}"
                          class="type-badge badge-group">Group Class Note</span>
                    <span th:if="${n.subject == 'Student' or n.subject == 'Student Note' or n.subject == 'Single' or n.subject == null}"
                          class="type-badge badge-single">Student Note</span>
                </div>

                <!-- State -->
                <div class="meta-cell">
                    <span class="meta-label">🗺 State</span>
                    <span th:if="${n.districtOrState == 'Florida'}"
                          class="state-pill state-florida" th:text="${n.districtOrState}"></span>
                    <span th:if="${n.districtOrState == 'Maryland'}"
                          class="state-pill state-maryland" th:text="${n.districtOrState}"></span>
                    <span th:if="${n.districtOrState == 'Common Core' or n.districtOrState == null}"
                          class="state-pill state-common"
                          th:text="${n.districtOrState != null ? n.districtOrState : '—'}"></span>
                </div>

                <!-- Grade -->
<!--                <div class="meta-cell">-->
<!--                    <span class="meta-label" style="text-align:center;">Grade</span>-->
<!--                    <span class="meta-value" th:text="${n.gradeLevel != null ? n.gradeLevel : '—'}"></span>-->
<!--                </div>-->
                <div class="meta-cell">
                    <span class="meta-label">Grade</span>
                    <span class="meta-value" th:text="${n.gradeLevel != null ? n.gradeLevel : '—'}"></span>
                </div>

            </div>
            <!-- END METADATA GRID -->

            <!-- ══ CARD BODY ══ -->
            <div class="card-body">

                <!-- Standard row (only if present) -->
                <div class="standard-row" th:if="${n.curriculumStandard != null and !#strings.isEmpty(n.curriculumStandard)}">
                    <span class="standard-icon">📐</span>
                    <span class="standard-text" th:text="${n.curriculumStandard}"></span>
                </div>

                <!-- Note text -->
                <div class="note-label">Approved Session Note Artifact:</div>
                <div class="note-text" th:text="${n.finalApprovedNote}"></div>

            </div>

        </div>
        <!-- END note-card -->

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(savedNotes)}" class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-title">No notes saved yet</div>
            <div class="empty-sub">Generate and save your first session note to see it here.</div>
        </div>

    </div>
</div>

</body>
</html>
