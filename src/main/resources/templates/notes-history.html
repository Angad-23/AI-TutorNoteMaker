<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MyVirtualTAs - Session History</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1A3480;
            --navy-dark: #0A1535;
            --navy-3: #0F1F55;
            --orange: #E8622A;
            --teal: #2BA8BF;
            --teal-2: #3DBDD6;
            --white: #FFFFFF;
            --off: #F5F7FC;
            --border: #DDE4F5;
            --text: #0A1535;
            --muted: #5B6E96;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; }

        /* Nav & Layout */
        .topnav { background: var(--navy-dark); height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-shadow: 0 2px 24px rgba(10,21,53,.5); }
        .logo-my { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--white); }
        .logo-virtual { font-family: 'Poppins', sans-serif; font-weight: 900; color: var(--orange); }
        .logo-tas { font-family: 'Poppins', sans-serif; font-weight: 900; color: var(--teal); }

        .body-wrap { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-family: 'Poppins', sans-serif; font-size: 1.8rem; color: var(--navy-dark); }
        .btn-back { background: var(--navy); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; }

        /* Grid Configuration */
        .history-grid { display: flex; flex-direction: column; gap: 20px; }
        .note-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 15px rgba(26,52,128,.04); }
        .card-top { background: var(--navy-3); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .meta-group { display: flex; gap: 15px; font-size: 0.85rem; align-items: center; flex-wrap: wrap; }
        .badge { background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; }

        /* Session Type Presentation Badges */
        .type-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
        .badge-group { background: var(--orange); color: var(--white); }
        .badge-single { background: var(--teal); color: var(--white); }

        .card-contents { padding: 20px; }
        .note-label { font-size: 0.75rem; font-weight: 800; color: var(--navy); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        .note-text { font-size: 0.92rem; line-height: 1.6; color: #1E293B; background: #F8FAFC; border: 1px solid #E2E8F0; padding: 14px; border-radius: 8px; font-style: italic; }
    </style>
</head>
<body>

<nav class="topnav">
    <div class="nav-logo">
        <span class="logo-my">My</span><span class="logo-virtual">Virtual</span><span class="logo-tas">TAs</span>
    </div>
    <a href="/notes" class="btn-back" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">+ New Note</a>
</nav>

<div class="body-wrap">
    <div class="page-header">
        <h1 class="page-title">Saved Session History</h1>
        <a href="/notes" class="btn-back">Back to Generator</a>
    </div>

    <div class="history-grid">
        <div th:each="n : ${savedNotes}" class="note-card">
            <div class="card-top">
                <div class="meta-group">
                    <div>📅 <strong th:text="${n.sessionDate != null ? n.sessionDate : 'Recent'}"></strong></div>
                    <div>🧑‍🏫 Tutor: <strong th:text="${n.tutorName != null ? n.tutorName : 'System'}"></strong></div>

                    <div>👥 Type:
                        <span th:if="${n.subject == 'Overall' || n.subject == 'Group Class Note' || n.subject == 'Group'}"
                              class="type-badge badge-group">Group Class Note</span>

                        <span th:if="${n.subject == 'Student' || n.subject == 'Student Note' || n.subject == 'Single' || n.subject == null}"
                              class="type-badge badge-single">Student Note</span>
                    </div>

                    <div>👩‍🎓 Student(s): <strong th:text="${n.studentName}"></strong></div>
                </div>
                <div>
                    <span class="badge" th:text="${n.districtOrState}"></span>
                    <span class="badge" th:text="${n.gradeLevel}"></span>
                </div>
            </div>
            <div class="card-contents">
                <div class="note-label">Approved Session Note Artifact:</div>
                <div class="note-text" th:text="${n.finalApprovedNote}"></div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(savedNotes)}" style="text-align:center; padding:60px; color:var(--muted);">
            No session historical artifacts logged in the system database index yet.
        </div>
    </div>
</div>

</body>
</html>
