<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MyVirtualTAs — Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1A3480; --navy-dark: #0A1535;
            --orange: #E8622A; --teal: #2BA8BF;
            --white: #FFFFFF; --off: #F5F7FC;
            --border: #DDE4F5; --text: #0A1535;
            --muted: #5B6E96; --green: #0B7A56; --green-bg: #E6FAF3;
        }
        body { font-family: 'Nunito', sans-serif; background: var(--off); min-height: 100vh; }

        .topnav {
            background: var(--navy-dark); height: 66px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; box-shadow: 0 2px 24px rgba(10,21,53,.5);
        }
        .logo-my      { font-family:'Poppins',sans-serif; font-weight:700; color:white; }
        .logo-virtual { font-family:'Poppins',sans-serif; font-weight:900; color:var(--orange); }
        .logo-tas     { font-family:'Poppins',sans-serif; font-weight:900; color:var(--teal); }
        .nav-link {
            text-decoration:none; color:rgba(255,255,255,.7);
            font-size:.78rem; font-weight:700; padding:6px 14px;
            border-radius:8px; border:1px solid rgba(255,255,255,.1);
            background:rgba(255,255,255,.06);
        }

        .page-wrap {
            max-width: 480px; margin: 60px auto; padding: 0 20px;
        }
        .card {
            background: white; border: 1.5px solid var(--border);
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(26,52,128,.08);
        }
        .card-head {
            background: var(--navy); padding: 20px 28px;
        }
        .card-head h2 {
            font-family: 'Poppins', sans-serif; font-weight: 800;
            font-size: 1.1rem; color: white; margin-bottom: 4px;
        }
        .card-head p { font-size: .75rem; color: rgba(255,255,255,.4); }
        .card-body { padding: 28px; }

        .field { margin-bottom: 18px; }
        .flabel { display:block; font-size:.72rem; font-weight:800; color:var(--navy); margin-bottom:6px; }
        .finput {
            width:100%; background:var(--off); border:1.5px solid var(--border);
            border-radius:9px; padding:11px 14px; font-size:.88rem;
            font-family:'Nunito',sans-serif; font-weight:600; color:var(--text);
            outline:none; transition:all .2s;
        }
        .finput:focus { border-color:var(--navy); background:white; box-shadow:0 0 0 3px rgba(26,52,128,.09); }

        .btn-submit {
            width:100%; background:var(--navy); color:white;
            border:none; border-radius:10px; padding:13px;
            font-size:.9rem; font-weight:800; font-family:'Poppins',sans-serif;
            cursor:pointer; transition:all .2s; margin-top:8px;
        }
        .btn-submit:hover { background:#142970; transform:translateY(-1px); }

        .alert-error {
            background:#FEF2F2; border:1.5px solid #FCA5A5;
            border-radius:10px; padding:12px 16px;
            font-size:.82rem; font-weight:700; color:#B91C1C;
            margin-bottom:18px;
        }
        .alert-success {
            background:var(--green-bg); border:1.5px solid #86EFAC;
            border-radius:10px; padding:12px 16px;
            font-size:.82rem; font-weight:700; color:var(--green);
            margin-bottom:18px;
        }
        .back-link {
            display:block; text-align:center; margin-top:20px;
            font-size:.78rem; font-weight:700; color:var(--muted);
            text-decoration:none;
        }
        .back-link:hover { color:var(--navy); }
    </style>
</head>
<body>

<nav class="topnav">
    <div>
        <span class="logo-my">My</span>
        <span class="logo-virtual">Virtual</span>
        <span class="logo-tas">TAs</span>
    </div>
    <a href="/notes" class="nav-link">Back to Note Generator</a>
</nav>

<div class="page-wrap">
    <div class="card">
        <div class="card-head">
            <h2>Reset Password</h2>
            <p>Enter your current password and choose a new one</p>
        </div>
        <div class="card-body">

            <div th:if="${errorMsg}" class="alert-error" th:text="${errorMsg}"></div>
            <div th:if="${successMsg}" class="alert-success" th:text="${successMsg}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="field">
                    <label class="flabel">Current Password</label>
                    <input type="password" name="currentPassword" class="finput"
                           placeholder="Enter your current password" required />
                </div>
                <div class="field">
                    <label class="flabel">New Password</label>
                    <input type="password" name="newPassword" class="finput"
                           placeholder="Min 6 characters" required />
                </div>
                <div class="field">
                    <label class="flabel">Confirm New Password</label>
                    <input type="password" name="confirmPassword" class="finput"
                           placeholder="Repeat new password" required />
                </div>

                <button type="submit" class="btn-submit">Update Password</button>
            </form>

            <a href="/notes" class="back-link">← Back to Note Generator</a>
        </div>
    </div>
</div>

</body>
</html>
