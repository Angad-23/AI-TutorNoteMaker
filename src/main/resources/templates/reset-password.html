<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MyVirtualTAs — Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1A3480; --navy-dark: #0A1535;
            --orange: #E8622A; --teal: #2BA8BF;
            --white: #FFFFFF; --off: #F5F7FC;
            --border: #DDE4F5; --text: #0A1535;
            --muted: #5B6E96; --green: #0B7A56; --green-bg: #E6FAF3;
            --sidebar-w: 240px;
        }
        body { font-family: 'Nunito', sans-serif; background: var(--off); min-height: 100vh; }

        /* ══ APP SHELL / SIDEBAR ══ */
        .app-shell { display:flex; min-height:100vh; }
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--navy-dark);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            box-shadow: 2px 0 24px rgba(10,21,53,.35);
            z-index: 100;
        }
        .sidebar-logo {
            display: flex; align-items: center; gap: 12px;
            padding: 22px 22px 18px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            text-decoration: none;
        }
        .logo-svg-wrap {
            width: 42px; height: 42px; background: white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            padding: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.2); flex-shrink: 0;
        }
        .logo-text-block { line-height: 1.1; }
        .logo-my { font-family:'Poppins',sans-serif; font-weight:700; font-size:1.1rem; color:var(--white); }
        .logo-virtual { font-family:'Poppins',sans-serif; font-weight:900; font-size:1.1rem; color:var(--orange); }
        .logo-tas { font-family:'Poppins',sans-serif; font-weight:900; font-size:1.1rem; color:var(--teal); }

        .sidebar-nav { padding: 16px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .snav-label {
            font-size: .62rem; font-weight: 800; color: rgba(255,255,255,.25);
            text-transform: uppercase; letter-spacing: .1em;
            padding: 10px 10px 6px;
        }
        .snav-link {
            display: flex; align-items: center; gap: 11px;
            padding: 10px 12px; border-radius: 9px;
            text-decoration: none; color: rgba(255,255,255,.6);
            font-size: .82rem; font-weight: 700;
            transition: all .15s;
        }
        .snav-icon { width: 18px; text-align: center; font-size: .9rem; flex-shrink: 0; }
        .snav-link:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.9); }
        .snav-link.active {
            background: rgba(232,98,42,.15);
            color: var(--orange);
            box-shadow: inset 3px 0 0 var(--orange);
        }

        .sidebar-footer { padding: 14px; border-top: 1px solid rgba(255,255,255,.08); }
        .snav-logout {
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(232,98,42,.12);
            border: 1px solid rgba(232,98,42,.28);
            color: var(--orange);
            border-radius: 9px;
            padding: 9px 12px;
            font-size: .8rem; font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: all .15s;
        }
        .snav-logout:hover { background: var(--orange); color: white; }

        .main-area { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }

        .sidebar-user {
            display: flex; align-items: center; gap: 10px;
            padding: 18px 22px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .sidebar-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--orange);
            display: flex; align-items: center; justify-content: center;
            font-size: .82rem; font-weight: 800; color: white;
            flex-shrink: 0;
        }
        .sidebar-username { font-size: .82rem; font-weight: 800; color: rgba(255,255,255,.9); }
        .sidebar-userrole { font-size: .68rem; font-weight: 600; color: rgba(255,255,255,.35); margin-top: 1px; }
        .pulse { width:7px; height:7px; border-radius:50%; background:#22C55E; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        /* ══ PAGE CONTENT (unchanged) ══ */
        .page-wrap {
            max-width: 480px; margin: 60px auto; padding: 0 20px; width: 100%;
        }
        .card {
            background: white; border: 1.5px solid var(--border);
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(26,52,128,.08);
        }
        .card-head {
            background: var(--navy); padding: 20px 28px;
        }
        .card-head h2 {
            font-family: 'Poppins', sans-serif; font-weight: 800;
            font-size: 1.1rem; color: white; margin-bottom: 4px;
        }
        .card-head p { font-size: .75rem; color: rgba(255,255,255,.4); }
        .card-body { padding: 28px; }

        .field { margin-bottom: 18px; }
        .flabel { display:block; font-size:.72rem; font-weight:800; color:var(--navy); margin-bottom:6px; }
        .finput {
            width:100%; background:var(--off); border:1.5px solid var(--border);
            border-radius:9px; padding:11px 14px; font-size:.88rem;
            font-family:'Nunito',sans-serif; font-weight:600; color:var(--text);
            outline:none; transition:all .2s;
        }
        .finput:focus { border-color:var(--navy); background:white; box-shadow:0 0 0 3px rgba(26,52,128,.09); }

        .btn-submit {
            width:100%; background:var(--navy); color:white;
            border:none; border-radius:10px; padding:13px;
            font-size:.9rem; font-weight:800; font-family:'Poppins',sans-serif;
            cursor:pointer; transition:all .2s; margin-top:8px;
        }
        .btn-submit:hover { background:#142970; transform:translateY(-1px); }

        .alert-error {
            background:#FEF2F2; border:1.5px solid #FCA5A5;
            border-radius:10px; padding:12px 16px;
            font-size:.82rem; font-weight:700; color:#B91C1C;
            margin-bottom:18px;
        }
        .alert-success {
            background:var(--green-bg); border:1.5px solid #86EFAC;
            border-radius:10px; padding:12px 16px;
            font-size:.82rem; font-weight:700; color:var(--green);
            margin-bottom:18px;
        }
        .back-link {
            display:block; text-align:center; margin-top:20px;
            font-size:.78rem; font-weight:700; color:var(--muted);
            text-decoration:none;
        }
        .back-link:hover { color:var(--navy); }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 860px) {
            .app-shell { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; position: relative;
                flex-direction: row; align-items: center; justify-content: space-between;
                padding: 10px 16px;
            }
            .sidebar-logo { border-bottom: none; padding: 0; }
            .sidebar-nav, .sidebar-footer { display: none; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
        <a th:href="@{/dashboard}" class="sidebar-logo">
            <div class="logo-svg-wrap">
                <img src="/logo.png" alt="MyVirtualTAs Logo" style="width:100%;height:100%;object-fit:contain;">
            </div>
            <div class="logo-text-block">
                <div><span class="logo-my">Triv</span><span class="logo-virtual">ekii</span><span class="logo-tas"></span></div>
            </div>
        </a>

        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${fullName != null and !#strings.isEmpty(fullName)} ? ${#strings.substring(fullName,0,1)} : 'T'">T</div>
            <div>
                <div class="sidebar-username" th:text="${fullName != null and !#strings.isEmpty(fullName)} ? ${fullName} : 'Tutor'">Tutor</div>
                <div class="sidebar-userrole"><span class="pulse" style="display:inline-block;margin-right:4px;"></span>Connected</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="snav-label">Module</div>
            <a th:href="@{/dashboard}" class="snav-link">
                <span class="snav-icon"></span> Dashboard
            </a>
            <a href="/notes" class="snav-link">
                <span class="snav-icon"></span> Generate Note
            </a>
            <a th:href="@{/notes/history}" class="snav-link">
                <span class="snav-icon"></span> Full History
            </a>
            <a href="/reset-password" class="snav-link active">
                <span class="snav-icon"></span> Reset Password
            </a>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="snav-logout">⏻ Logout</button>
            </form>
        </div>
    </aside>

    <!-- ══ MAIN AREA ══ -->
    <div class="main-area">
        <div class="page-wrap">
            <div class="card">
                <div class="card-head">
                    <h2>Reset Password</h2>
                    <p>Enter your current password and choose a new one</p>
                </div>
                <div class="card-body">

                    <div th:if="${errorMsg}" class="alert-error" th:text="${errorMsg}"></div>
                    <div th:if="${successMsg}" class="alert-success" th:text="${successMsg}"></div>

                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="field">
                            <label class="flabel">Current Password</label>
                            <input type="password" name="currentPassword" class="finput"
                                   placeholder="Enter your current password" required />
                        </div>
                        <div class="field">
                            <label class="flabel">New Password</label>
                            <input type="password" name="newPassword" class="finput"
                                   placeholder="Min 6 characters" required />
                        </div>
                        <div class="field">
                            <label class="flabel">Confirm New Password</label>
                            <input type="password" name="confirmPassword" class="finput"
                                   placeholder="Repeat new password" required />
                        </div>

                        <button type="submit" class="btn-submit">Update Password</button>
                    </form>

                    <a href="/notes" class="back-link">← Back to Note Generator</a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
